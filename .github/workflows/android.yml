name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, lint & test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Lint runs first and is a hard gate. It is the check that found three
      # RemoteViews elements that would have crashed every home-screen widget at
      # inflate time; without it in CI those shipped clean through a green build.
      - name: Lint
        run: ./gradlew lintOfflineDebug --no-daemon

      # The two halves of the privacy boundary, both enforced here.
      #
      # The first proves the published APK cannot open a socket: the merged
      # manifest must have no INTERNET permission, and a transitive dependency
      # (ML Kit → transport-backend-cct) declares one, so this is not theoretical.
      #
      # The second proves the code that *can* open sockets has no way to reach a
      # memory — :web-api and :web-impl must not see Room or :app, and :web-impl
      # must stay out of the offline build entirely. Without it, a networked
      # module could pass the permission check and still upload a transcript the
      # moment someone wrote the call.
      - name: Assert offline build has no network permission
        run: ./gradlew checkOfflineDebugHasNoNetworkPermission checkOfflineReleaseHasNoNetworkPermission --no-daemon

      - name: Assert the web layer cannot see memories
        run: ./gradlew checkWebModuleBoundary --no-daemon

      - name: Unit tests
        run: ./gradlew testOfflineDebugUnitTest --no-daemon

      # Reports are only useful when something broke, and that is exactly when
      # the log alone does not say enough.
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/testOfflineDebugUnitTest
          if-no-files-found: ignore

      - name: Upload lint report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-offlineDebug.html
          if-no-files-found: ignore

      # Both flavours are built. The connected one is not published by default,
      # but a flavour nobody compiles is a flavour that quietly stops compiling.
      # Release is built too: minification and resource shrinking only run there,
      # so a bad ProGuard rule is invisible until this step.
      - name: Build both flavours, debug and release
        run: ./gradlew assembleOfflineDebug assembleOfflineRelease assembleConnectedDebug --no-daemon

      - name: Upload offline debug APK
        uses: actions/upload-artifact@v4
        with:
          name: naomi-offline-debug-apk
          path: app/build/outputs/apk/offline/debug/app-offline-debug.apk
          if-no-files-found: error
