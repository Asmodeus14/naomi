name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build & publish release
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Assert offline build has no network permission
        run: ./gradlew checkOfflineReleaseHasNoNetworkPermission --no-daemon

      - name: Assert the web layer cannot see memories
        run: ./gradlew checkWebModuleBoundary --no-daemon

      - name: Lint
        run: ./gradlew lintOfflineRelease --no-daemon

      - name: Unit tests
        run: ./gradlew testOfflineReleaseUnitTest --no-daemon

      # Only the offline flavour is published. The connected build exists for
      # people who deliberately want the research layer and must be built from
      # source — shipping it here beside the offline APK would make the download
      # page the place where someone accidentally installs the one that can
      # reach the network.
      #
      # This previously built and published the *debug* APK. A debuggable build
      # lets anyone with adb read the on-device memory database through `run-as`,
      # which is the opposite of what this app promises. Release only.
      - name: Restore upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 is not set. See DEPLOYMENT.md."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/signing"
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/signing/upload.jks"
          test -s "$RUNNER_TEMP/signing/upload.jks" || { echo "::error::Decoded keystore is empty."; exit 1; }

      - name: Build signed release APK
        env:
          VERSION_CODE: ${{ 1000 + github.run_number }}
          KEYSTORE_FILE: ${{ runner.temp }}/signing/upload.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:verifyReleaseSigning :app:assembleOfflineRelease --no-daemon

      # The APK here is for sideloading and for people who do not use Play; the
      # Play track is fed by android-release.yml, which uploads the AAB. Still a
      # draft, so a human decides when it becomes visible.
      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/offline/release/app-offline-release.apk
          generate_release_notes: true
          draft: true
          prerelease: false
          body: |
            Signed with Naomi's upload key and installable directly.

            This is the **offline** build. It declares no `INTERNET` permission,
            which you can check for yourself:

            ```
            aapt2 dump permissions app-offline-release.apk
            ```
