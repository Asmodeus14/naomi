name: Android Release (Internal Testing)

# Every push to main that passes CI becomes an Internal Testing build. Internal
# Testing is a closed track visible only to testers you list in Play Console —
# it is not public, and reaching it does not publish anything.
#
# Production is a separate, manual workflow. See android-production.yml.
on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      track:
        description: "Play track to upload to"
        required: true
        default: internal
        type: choice
        options: [ internal, alpha, beta ]

concurrency:
  # Never let two uploads race: Play rejects a duplicate versionCode, and a
  # cancelled-midway upload is harder to reason about than a queued one.
  group: android-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Build, sign & upload to Play
    runs-on: ubuntu-latest

    env:
      # Monotonic and stateless. The 1000 offset clears the versionCodes already
      # consumed by 0.1.0 and 0.2.0, so this sequence can never collide with an
      # upload that already exists. See DEPLOYMENT.md.
      VERSION_CODE: ${{ 1000 + github.run_number }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # The same gates CI runs. A release that skipped them would be a release
      # nobody checked — and the two privacy gates are the ones that must never
      # be optional, because the claim they protect is the product.
      - name: Lint
        run: ./gradlew lintOfflineRelease --no-daemon

      - name: Unit tests
        run: ./gradlew testOfflineReleaseUnitTest --no-daemon

      - name: Assert offline build has no network permission
        run: ./gradlew checkOfflineReleaseHasNoNetworkPermission --no-daemon

      - name: Assert the web layer cannot see memories
        run: ./gradlew checkWebModuleBoundary --no-daemon

      # The keystore arrives base64-encoded because a GitHub secret is a string.
      # It is written outside the workspace so it cannot be picked up by a later
      # step that globs the repo, and it never touches the artifact upload.
      - name: Restore upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 is not set. See DEPLOYMENT.md."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/signing"
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/signing/upload.jks"
          # Prove the file decoded to a real keystore without revealing anything.
          if [ ! -s "$RUNNER_TEMP/signing/upload.jks" ]; then
            echo "::error::Decoded keystore is empty — is the secret valid base64?"
            exit 1
          fi
          echo "Keystore restored ($(stat -c%s "$RUNNER_TEMP/signing/upload.jks") bytes)."

      - name: Verify signing configuration
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/signing/upload.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:verifyReleaseSigning --no-daemon

      - name: Build signed release bundle
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/signing/upload.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:bundleOfflineRelease --no-daemon

      # Only the offline flavour is ever published. The connected flavour has
      # INTERNET and exists to be built from source by someone who wants it.
      - name: Confirm the bundle is signed
        run: |
          AAB=app/build/outputs/bundle/offlineRelease/app-offline-release.aab
          test -f "$AAB" || { echo "::error::No bundle at $AAB"; exit 1; }
          # A signed AAB carries a signature block in META-INF.
          if ! unzip -l "$AAB" | grep -qiE "META-INF/.*\.(RSA|EC|DSA)"; then
            echo "::error::$AAB has no signature block."
            exit 1
          fi
          echo "Signed bundle: $AAB ($(stat -c%s "$AAB") bytes), versionCode $VERSION_CODE"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: naomi-offline-release-aab
          path: app/build/outputs/bundle/offlineRelease/app-offline-release.aab
          if-no-files-found: error
          retention-days: 90

      # The mapping file is what turns a Play crash report back into readable
      # stack traces. Without it, minified releases produce unreadable crashes.
      - name: Upload R8 mapping
        uses: actions/upload-artifact@v4
        with:
          name: naomi-r8-mapping
          path: app/build/outputs/mapping/offlineRelease/mapping.txt
          if-no-files-found: warn
          retention-days: 90

      - name: Write Play service-account key
        id: play_key
        env:
          PLAY_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PLAY_JSON" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GOOGLE_PLAY_SERVICE_ACCOUNT_JSON not set — skipping the Play upload. The signed AAB is still attached to this run."
            exit 0
          fi
          # Written outside the workspace, removed in the always() step below.
          printf '%s' "$PLAY_JSON" > "$RUNNER_TEMP/play-service-account.json"
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Upload to Play — Internal Testing
        if: steps.play_key.outputs.configured == 'true'
        uses: r0adkll/upload-google-play@935ef9c68bb393a8e6116b1575626a7f5be3a7fb # v1.1.3
        with:
          serviceAccountJson: ${{ runner.temp }}/play-service-account.json
          packageName: com.naomi.app
          releaseFiles: app/build/outputs/bundle/offlineRelease/app-offline-release.aab
          track: ${{ github.event.inputs.track || 'internal' }}
          status: completed
          mappingFile: app/build/outputs/mapping/offlineRelease/mapping.txt

      # always(), so the credential is removed even if the upload failed.
      - name: Remove Play service-account key
        if: always()
        run: rm -f "$RUNNER_TEMP/play-service-account.json"

      - name: Remove keystore
        if: always()
        run: rm -rf "$RUNNER_TEMP/signing"
